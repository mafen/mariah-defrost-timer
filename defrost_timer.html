<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mariah Carey Defrosting Timer</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="test.css">
</head>
<body>
  <h1>Mariah Carey Defrosting Timer ❄️</h1>
  <div class="progress-container">
    <div class="progress-bar" id="progress-bar">0%</div>
  </div>
  <div class="timer" id="timer">Calculating time until full defrost...</div>

  <div class="mariah-container">
    <div class="ice-block" id="ice-block">
      <div class="crack" id="crack"></div>
    </div>
    <img
      class="mariah-gif"
      src="assets/mariah-carey-christmas-hd.gif"
      alt="Mariah Carey defrosting for Christmas"
    >
  </div>

  <div class="test-controls">
    <button type="button" onclick="toggleTestMode()">Toggle Test Mode</button>
    <button type="button" onclick="shatterIce()">Force Shatter</button>
  </div>

  <script src="timer.js"></script>
</body>
</html>
